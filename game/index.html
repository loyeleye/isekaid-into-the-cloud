<style>
/* Layout: one full-height app. The hub is a canvas village; everything else is a chunky storybook window over it. */
:root {
  color-scheme: light;
  --sky1: #7cc8ff;

  --sun: #ffc93c;

  --mint: #2fbf7f;
  --red: #ff5a5a;
  --violet: #8b6cff;
  --orange: #ff9a3c;
  --f-head: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --pop: 0 4px 0 var(--ink);
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
*, *::before, *::after { box-sizing: border-box; }

button { font: inherit; color: inherit; cursor: pointer; }

:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.warn { color: #b26b00; font-weight: 700; }
.app { position: relative; height: 100%; overflow: hidden; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; }

/* Buttons: chunky and bouncy */
.primary, .ghost, .danger, .row button, .conf-b button {
  border-radius: 12px; padding: 9px 16px; font-family: var(--f-head); font-weight: 600; letter-spacing: .02em; font-size: 15px;
  border: 3px solid var(--ink); box-shadow: var(--pop); transition: transform .08s, box-shadow .08s;
}
.primary:active:not(:disabled), .ghost:active:not(:disabled), .danger:active:not(:disabled), .row button:active:not(:disabled), .conf-b button:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.primary { background: var(--blue); color: #fff; }
.primary:hover:not(:disabled) { background: #4d98ff; }
.ghost { background: #fff; color: var(--ink); }
.ghost:hover:not(:disabled) { background: #f3f8ff; }
.danger { background: #ffe1e1; color: #a3172b; }
.row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.row button { background: #fff; }
.row button.primary { background: var(--blue); }

/* Title */
#screen-title { align-items: center; justify-content: center; text-align: center; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); background: linear-gradient(180deg, var(--sky1), var(--sky2) 70%, #fff4d8); overflow: hidden; }
.t-sun { position: absolute; top: 8%; right: 10%; width: 90px; height: 90px; border-radius: 50%; background: radial-gradient(circle, #fff6b0, var(--sun) 60%); box-shadow: 0 0 60px 20px rgba(255, 220, 90, .55); animation: pulse 4s ease-in-out infinite; }
#title-clouds { position: absolute; inset: 0; pointer-events: none; }
.cloud { position: absolute; width: 160px; height: 52px; background: #fff; border-radius: 40px; opacity: .95; animation: drift linear infinite; }
.cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
.cloud::before { width: 70px; height: 70px; left: 24px; top: -34px; }
.cloud::after { width: 54px; height: 54px; left: 80px; top: -24px; }
.t-hills { position: absolute; left: -10%; right: -10%; bottom: -60px; height: 220px; background: radial-gradient(ellipse at 30% 100%, #79d36b 0 55%, transparent 56%), radial-gradient(ellipse at 75% 100%, #5fc25a 0 58%, transparent 59%); pointer-events: none; }
.t-ribbon { position: relative; display: inline-block; font-family: var(--f-head); font-weight: 600; font-size: clamp(12px, 3.2vw, 15px); color: #fff; background: var(--pink); border: 3px solid var(--ink); border-radius: 10px; padding: 4px 14px; box-shadow: var(--pop); transform: rotate(-2deg); max-width: 34em; text-wrap: balance; }
.logo { position: relative; font-family: var(--f-head); font-weight: 700; font-size: clamp(46px, 12vw, 104px); line-height: .95; margin: 18px 0 6px; color: #fff; letter-spacing: .01em;
  text-shadow: 3px 3px 0 var(--ink), -3px 3px 0 var(--ink), 3px -3px 0 var(--ink), -3px -3px 0 var(--ink), 0 4px 0 var(--ink), 0 10px 0 rgba(43,35,64,.25); animation: bob 3.2s ease-in-out infinite; }

.tagline { position: relative; max-width: 32em; color: var(--ink); margin: 14px auto 22px; text-wrap: balance; font-weight: 600; }
#title-actions { position: relative; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.press { font-size: 20px !important; padding: 12px 28px !important; animation: blink 1.4s steps(2) infinite; }
.t-foot { position: absolute; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0; font-size: 12px; color: #2c5a2a; font-weight: 700; }
.snd { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); z-index: 3; }

/* Hub */
#hud { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); background: var(--cream); border-bottom: 3px solid var(--ink); z-index: 2; }
#hud .ghost { padding: 6px 12px; font-size: 14px; }
.rank { width: 44px; height: 44px; display: grid; place-items: center; align-content: center; border: 3px solid var(--ink); background: var(--sun); border-radius: 12px; box-shadow: 0 3px 0 var(--ink); }

.hud-name { font-family: var(--f-head); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud-chip { font-size: 12px; font-weight: 700; padding: 4px 10px; border: 2px solid var(--ink); border-radius: 20px; white-space: nowrap; background: #fff; }

#hub-canvas { flex: 1; width: 100%; min-height: 0; display: block; touch-action: none; }
#room-canvas { flex: 1; width: 100%; min-height: 0; display: block; touch-action: none; background: #1a1530; }
body:has(#dialog:not([hidden])) .hub-hint { display: none; }
.hub-hint { position: absolute; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); font-size: 12px; font-weight: 700; color: var(--ink); background: rgba(255,250,240,.92); border: 2px solid var(--ink); padding: 4px 12px; border-radius: 20px; pointer-events: none; white-space: nowrap; }

/* Town: a placeholder menu until the walkable town exists (js/main.js) */
#town { flex: 1; min-height: 0; overflow-y: auto; display: grid; place-items: start center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(180deg, var(--sky1), var(--sky2)); }
.town-win { animation: none; }

/* Bars */
.bar { position: relative; height: 10px; background: #fff; border: 2px solid var(--ink); border-radius: 10px; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; transition: width .35s ease; border-radius: 8px; }
.bar.xp i { background: linear-gradient(90deg, var(--blue), #7ec0ff); }
.bar.sla i { background: linear-gradient(90deg, var(--mint), #7ee3a8); }
.bar.sev { height: 20px; }
.bar.sev i { background: linear-gradient(90deg, var(--red), var(--foe, var(--pink))); }
.bar.sev span { position: relative; display: block; font-size: 12px; font-weight: 800; padding-left: 8px; line-height: 16px; }
.hud-sla { display: flex; align-items: center; gap: 8px; font-family: var(--f-head); font-weight: 600; font-size: 14px; }
.hud-sla .bar { flex: 1; min-width: 80px; height: 14px; }

/* Windows */
#panel { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(43, 35, 64, .45); padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.win { position: relative; width: min(560px, 100%); max-height: 100%; display: flex; flex-direction: column; background: var(--cream); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 6px 0 var(--ink); animation: winIn .25s cubic-bezier(.2, 1.4, .4, 1); overflow: hidden; }
.win.wide { width: min(860px, 100%); }
.win-h { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; border-bottom: 3px solid var(--ink); font-family: var(--f-head); font-weight: 600; font-size: 16px; color: #fff; background: var(--blue); }
.win-h .x { background: #fff; border: 2px solid var(--ink); color: var(--ink); font-size: 13px; width: 28px; height: 28px; border-radius: 50%; padding: 0; line-height: 1; }
.win-b { padding: 16px; overflow-y: auto; min-height: 0; }
.win-b p { margin: 0 0 10px; }
.q-ctx { font-family: var(--f-head); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--blue-d); margin-bottom: 6px; }
.q-q { font-size: 17px; font-weight: 700; text-wrap: balance; }
.opts { display: grid; gap: 8px; margin: 12px 0; }
.opt { text-align: left; padding: 11px 13px; background: #fff; border: 2px solid var(--ink); border-radius: 12px; line-height: 1.4; box-shadow: 0 3px 0 rgba(43,35,64,.85); transition: transform .08s; }
.opt:hover:not(:disabled) { background: #f1f7ff; transform: translateY(-1px); }
.opt.on { background: #dcebff; box-shadow: 0 3px 0 var(--blue-d); border-color: var(--blue-d); }
.opt.struck { text-decoration: line-through; }
.conf { border-top: 2px dashed var(--line); padding-top: 12px; margin-top: 6px; }
.conf-b { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.conf-b button { flex: 1 1 90px; background: #fff; }
.conf-b button[data-c="2"]:not(:disabled) { background: var(--sun); }
.num { display: flex; align-items: center; gap: 10px; margin: 12px 0; flex-wrap: wrap; font-weight: 700; }
.num input { flex: 1 1 140px; min-width: 0; background: #fff; border: 3px solid var(--ink); color: var(--ink); padding: 10px 12px; font: 600 18px var(--f-head); border-radius: 12px; }
.order-done { display: flex; flex-wrap: wrap; gap: 6px; min-height: 30px; margin: 10px 0; }
.chip { font-size: 12px; font-weight: 700; padding: 3px 9px; border: 2px solid var(--ink); border-radius: 20px; background: #fff; white-space: nowrap; }

.help-b { display: inline-block; margin: 10px 8px 0 0; padding: 6px 14px; font-size: 14px; }
.nots { margin-top: 8px; font-size: 0.92em; }

.tier { display: inline-block; font-size: 0.78em; font-weight: 800; padding: 0 6px; border-radius: 6px; background: #eee; }
.tier-broken { background: #f3d3d3; color: #8a2020; } .tier-bad { background: #fde3e3; color: #b23b3b; }
.tier-good { background: #fff1c2; color: #7a5a00; } .tier-great { background: #e3f5e9; color: #1d7a43; }
.q-text { width: 100%; box-sizing: border-box; font: inherit; padding: 8px 10px; border: 3px solid var(--ink, #2b2340); border-radius: 12px; resize: vertical; }

/* A boss step's evidence (js/quiz.js q.ev): an error, a CloudTrail event or a metric, as it would appear on screen */
pre.q-ev { margin: 4px 0 10px; padding: 8px 10px; border-left: 4px solid #e0a030; background: #1b1724; color: #f1ecff; border-radius: 0 8px 8px 0; font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 40vh; overflow-y: auto; }
.rubric { display: grid; gap: 6px; margin: 6px 0; }
.rubric .rp { display: flex; gap: 8px; align-items: flex-start; padding: 6px 8px; border: 2px solid #ddd5f0; border-radius: 10px; cursor: pointer; }
.rubric .rp.on { border-color: #7fd6a8; background: #e9fbf2; }
.rubric input { margin-top: 3px; }
/* Design Board (js/board.js) */
.bd .bd-head { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.bd .bd-mini { padding: 2px 10px; font-size: 0.85em; }

.bd .bd-board { position: relative; width: 100%; aspect-ratio: 4 / 4.8; margin: 6px 0; background: #fff; border: 3px solid var(--ink); border-radius: 12px;
  background-image: radial-gradient(#d9d2ea 1.2px, transparent 1.2px); background-size: 25% 16.666%; background-position: 12.5% 8.333%; }
.bd .bd-lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; color: var(--ink); }

  background: #fff8e6; border: 2px solid var(--ink); border-radius: 10px; box-shadow: 0 2px 0 var(--ink); font-size: 0.68em; line-height: 1.1; font-weight: 700; text-align: center; }

.say-first { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: #fff8e6; border: 2px dashed #e7b84a; }

/* Building lessons */

.lw { background: #fffdf6; border: 3px solid var(--ink); border-radius: 14px; padding: 6px; overflow: hidden; }

/* Sorting bins */

/* Napkin math and percentile sliders */

/* Dispatch */

.dd-id { display: block; font: 700 12px var(--f-head); color: var(--blue-d); }

/* Log replay */

/* Limiter lab and jitter garden charts */

.ll-ok { fill: var(--mint); } .ll-no { fill: var(--red); }
.ll-min { stroke: var(--violet); stroke-width: 2; stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; }
.ll-cap { stroke: var(--ink); stroke-width: 2; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; }
.ll-axis { display: flex; justify-content: space-between; }
/* Index hunt */
.ih-shelf { display: grid; grid-template-columns: repeat(16, 1fr); gap: 3px; margin: 8px 0; }

.ih-shelf i.seen { background: #e3dbcf; } .ih-shelf i.hit { background: var(--mint); }

.ih-card { height: 34px; padding: 0; border: 2px solid var(--ink); border-radius: 4px; background: #fff7d6; font: 700 9px var(--f-head); overflow: hidden; }
.ih-card.out { background: #e9e4f0; opacity: .45; } .ih-card.open { background: #d6e8ff; } .ih-card.hit { background: var(--mint); color: #fff; }
@media (max-width: 520px) { .ih-shelf, .ih-cards { grid-template-columns: repeat(8, 1fr); } }
/* Quorum dial */
.qd-reps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
.qd-rep { display: grid; justify-items: center; gap: 2px; padding: 8px 4px; border: 3px solid var(--ink); border-radius: 12px; background: #f1edf7; text-align: center; font-size: 12px; }
.qd-rep svg { width: 30px; height: 30px; color: var(--muted); }
.qd-rep.fresh { background: #dcf7e8; } .qd-rep.fresh svg { color: #1f8a57; }
.qd-rep.read { box-shadow: 0 0 0 4px var(--sun); }

.hb-kids, .bb-seys { grid-template-columns: repeat(5, 1fr); }
.bb-seys .qd-rep.bb-left { background: #e3e9f7; border-style: dashed; }
.tl-svg { width: 100%; max-width: 560px; display: block; margin: 8px auto; }
.mg-meter { display: grid; grid-template-columns: 110px 1fr 84px; gap: 8px; align-items: center; font-size: 12px; margin: 5px 0; }
.mg-meter .bar { height: 14px; border: 2px solid var(--ink); border-radius: 7px; background: #fff; overflow: hidden; }
.mg-meter .bar i { display: block; height: 100%; background: var(--mint); } .mg-meter .bar i.hot { background: var(--red); }
.mg-chain { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0; font-size: 12px; }
.mg-chain span { padding: 4px 8px; border: 2px solid var(--ink); border-radius: 8px; background: #f1edf7; } .mg-chain span.on { background: #dcf7e8; }
.mg-alert svg { width: 44px; height: 44px; flex: none; color: var(--red); }
.tl-lane { font: 600 12px var(--f-head); fill: var(--ink); }
.tl-line { stroke: #c9c2d8; stroke-width: 3; }
.tl-msg { stroke: #3b8bff; stroke-width: 2.5; stroke-dasharray: 5 4; }
.tl-head { fill: #3b8bff; }
.tl-dot { fill: #fff; stroke: var(--ink); stroke-width: 2.5; } .tl-dot.on { fill: var(--sun); }
.tl-clock { font: 700 10px var(--f-body, sans-serif); fill: var(--muted); text-anchor: middle; }
.sg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ll-log { margin: 6px 0; padding-left: 18px; }
.intent.then { margin-top: 4px; opacity: .85; } .intent.then .lbl { background: #7a6bd6; }
@media (max-width: 560px) { .hb-kids, .bb-seys { grid-template-columns: repeat(3, 1fr); } .sg-grid { grid-template-columns: 1fr; } }
.qd-dials { display: grid; gap: 6px; } .qd-dials .row { margin-top: 4px; }
.qd-goals { list-style: none; padding: 0; margin: 10px 0; display: grid; gap: 4px; }
.qd-goals li { padding: 6px 10px; border-radius: 10px; background: #ffe1e1; font-weight: 700; }

.pp-hist .ss-bar { width: 50px; }
/* Declutter */
.dc-parts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin: 8px 0 12px; }
.dc-part { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: #fff; border: 2px solid var(--ink); border-radius: 12px; box-shadow: 0 3px 0 var(--ink); text-align: left; font-size: 13px; }
.dc-part svg { flex: none; width: 22px; height: 22px; color: var(--blue-d); }

.loot { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }

.shopkeep svg { flex: none; }
.links { padding-left: 18px; margin: 8px 0; display: grid; gap: 6px; }

.gist { display: grid; gap: 12px; }

.gate-art { position: relative; width: 110px; height: 110px; margin: 0 auto 12px; border-radius: 50%; border: 3px solid var(--ink); background: repeating-conic-gradient(from 0deg, #8b6cff 0 20deg, #3b8bff 20deg 40deg); animation: spin 6s linear infinite; box-shadow: 0 4px 0 var(--ink); }

.dlg-nm { position: absolute; top: -16px; left: 14px; display: flex; gap: 8px; align-items: baseline; padding: 2px 12px; background: var(--blue); color: #fff; border: 3px solid var(--ink); border-radius: 12px; max-width: calc(100% - 28px); }
#dialog[data-who="narr"] .dlg-nm, #dialog[data-who="system"] .dlg-nm { display: none; }
#dialog[data-who="gary"] .dlg-nm { background: var(--sun); color: var(--ink); }
#dialog[data-who="uptima"] .dlg-nm { background: var(--pink); }
#dialog[data-who="latency"] .dlg-nm { background: var(--violet); }
#dialog[data-who="pip"] .dlg-nm { background: #19b3c9; }
#dlg-name { font-family: var(--f-head); font-weight: 600; white-space: nowrap; }
#dlg-title { font-size: 11px; font-weight: 700; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#dlg-text { min-height: 3em; font-size: 16px; font-weight: 600; }
.dlg-foot { display: flex; gap: 16px; justify-content: space-between; margin-top: 6px; font-size: 11px; color: var(--muted); font-weight: 700; }

@media (max-width: 520px) { #dlg-portrait svg { width: 70px; height: 82px; } #dlg-text { font-size: 15px; } }

/* Cutscene stage */
#stage { position: fixed; inset: 0; z-index: 25; overflow: hidden; transition: background .6s; }
/* A form opened during a cutscene (the cold open's Hero Registration Form) sits above the stage, not hidden behind it. */
body.cut #panel { z-index: 28; }
#stage[data-scene="office"] { background: radial-gradient(ellipse at 50% 40%, #3b3a5c, #15132a 75%); }
#stage[data-scene="office"]::before { content: ""; position: absolute; left: 50%; top: 30%; width: min(48vw, 300px); aspect-ratio: 16 / 10; transform: translateX(-50%); border: 6px solid #0d0b1c; border-radius: 10px; background: linear-gradient(180deg, #1e3d7a, #102347); box-shadow: 0 0 60px rgba(90, 150, 255, .4); }
#stage[data-scene="office"]::after { content: "git push origin main --force"; position: absolute; left: 50%; top: calc(30% + min(14vw, 86px)); transform: translateX(-50%); font: 700 clamp(10px, 2.4vw, 14px) ui-monospace, monospace; color: #9fe6a0; white-space: nowrap; }
#stage[data-scene="sky"] { background: linear-gradient(180deg, #ffd6f0, #cbe9ff 60%, #fff); }
#stage[data-scene="sky"]::before { content: ""; position: absolute; left: 50%; top: 18%; width: 260px; height: 260px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(circle, rgba(255,240,170,.9), rgba(255,240,170,0) 70%); animation: pulse 3s ease-in-out infinite; }
#stage[data-scene="plaza"] { background: linear-gradient(180deg, #7cc8ff, #dff3ff 55%, #8fd16a 56%, #6cbf55); }
#stage .cloud { animation-duration: 30s; }
#stage .actor { position: absolute; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); animation: actorIn .45s cubic-bezier(.2, 1.5, .4, 1); }
#stage .actor svg { width: min(280px, 62vw); height: auto; filter: drop-shadow(0 8px 0 rgba(43,35,64,.3)); animation: bob 3s ease-in-out infinite; }
body.cut #dlg-portrait { display: none; }
body.cut #dialog[data-who="narr"] { background: transparent; place-items: end center; padding-bottom: calc(22vh + env(safe-area-inset-bottom, 0px)); }
body.cut #dialog[data-who="narr"] .dlg-box { background: rgba(43, 35, 64, .82); border-radius: 16px; padding: 14px 20px 10px; }
@keyframes actorIn { from { opacity: 0; transform: translate(-50%, 30px) scale(.9); } }
.flash { position: fixed; inset: 0; z-index: 70; background: #fff; pointer-events: none; animation: flashOut .6s ease-out forwards; }

/* Painted busts (dialogue and stage) */
.bust { position: relative; display: inline-block; vertical-align: bottom; }
.bust img { position: relative; width: 100%; height: 100%; object-fit: contain; object-position: bottom center; display: block; }
#dlg-portrait .bust { filter: drop-shadow(0 4px 0 rgba(43,35,64,.35)); margin-bottom: -4px; }
#dialog.painted .dlg { align-items: flex-end; }
.b-uptima::before { content: ""; position: absolute; z-index: 1; left: 50%; top: 0; width: 34%; height: 6%; transform: translateX(-50%); border: 4px solid #ffcf33; border-radius: 50%; box-shadow: 0 0 14px 3px rgba(255, 214, 90, .8); animation: bob 2.6s ease-in-out infinite; }
#stage .actor .bust { width: min(330px, 72vw) !important; height: auto !important; aspect-ratio: 120 / 140; filter: drop-shadow(0 8px 0 rgba(43,35,64,.3)); animation: bob 3s ease-in-out infinite; }
@media (max-width: 520px) { #dlg-portrait .bust { width: 84px !important; height: 98px !important; } }

/* Cold open: waking up in the heavens (js/intro.js). data-glow 3 is blinding light; 0 is an ordinary sky. */
#stage .heaven { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 2.6s ease, filter 2s ease; }
#stage .heaven.wash { background: radial-gradient(circle at 50% 24%, #fffef6 0, #fff4cc 24%, rgba(255, 228, 240, .75) 52%, rgba(255, 255, 255, .35) 80%); }
#stage .heaven.rays { overflow: hidden; -webkit-mask-image: radial-gradient(circle at 50% 24%, #000 0, transparent 70%); mask-image: radial-gradient(circle at 50% 24%, #000 0, transparent 70%); }
#stage .heaven.rays i { position: absolute; left: 50%; top: 24%; width: 260vmax; height: 260vmax; margin: -130vmax 0 0 -130vmax; background: repeating-conic-gradient(rgba(255, 246, 200, .7) 0 5deg, rgba(255, 246, 200, 0) 5deg 14deg); animation: spin 90s linear infinite; }
#stage .heaven.motes i { position: absolute; bottom: -4%; width: 8px; height: 8px; border-radius: 50%; background: #fffbe6; box-shadow: 0 0 10px 3px rgba(255, 236, 160, .9); scale: var(--s); animation: moteUp 8s linear infinite; }
#stage .heaven.motes b { position: absolute; top: -8%; width: 14px; height: 30px; border-radius: 50% 50% 50% 50% / 70% 70% 30% 30%; background: linear-gradient(90deg, #fff 50%, #f1ecff 50%); box-shadow: 0 0 8px rgba(255, 255, 255, .9); animation: featherDown 14s linear infinite; }
#stage[data-glow="3"] .heaven { opacity: 1; }
#stage[data-glow="2"] .heaven.wash { opacity: .7; } #stage[data-glow="2"] .heaven.rays { opacity: .55; } #stage[data-glow="2"] .heaven.motes { opacity: .8; }
#stage[data-glow="1"] .heaven.wash { opacity: .3; } #stage[data-glow="1"] .heaven.rays { opacity: .15; } #stage[data-glow="1"] .heaven.motes { opacity: .35; }
#stage[data-glow] .actor .bust { transition: filter 2.6s ease; }
#stage[data-glow="3"] .actor .bust { filter: drop-shadow(0 0 18px #fff6c8) drop-shadow(0 0 46px #ffd76a) brightness(1.12); }
#stage[data-glow="2"] .actor .bust { filter: drop-shadow(0 0 12px #fff6c8) drop-shadow(0 0 26px #ffd76a) brightness(1.05); }
#stage[data-glow="1"] .actor .bust { filter: drop-shadow(0 0 6px #fff6c8) drop-shadow(0 8px 0 rgba(43, 35, 64, .3)); }
/* Falling through The Cloud after the name form (U.fall in js/intro.js): wind streaks, puffs and the kingdom's data rush up past you. */
#stage[data-scene="fall"] { background: linear-gradient(180deg, #4f9be8, #9fd3ff 55%, #e4f4ff); }
#stage .fall { position: absolute; inset: 0; overflow: hidden; }
#stage .fall .streak { position: absolute; top: 0; width: 3px; height: 26vh; border-radius: 2px; background: linear-gradient(rgba(255,255,255,0), rgba(255,255,255,.95)); animation: rushUp linear infinite; }
#stage .fall .bit { position: absolute; top: 0; padding: 2px 9px; border: 2px solid var(--ink); border-radius: 8px; background: rgba(255,255,255,.85); color: #2b4f86; font: 700 clamp(12px, 2.3vw, 17px) ui-monospace, monospace; white-space: nowrap; animation: rushUp linear infinite; }
#stage .fall .bit.e { padding: 0; border: 0; background: none; font-size: clamp(26px, 5vw, 42px); }
#stage .fall .cloud.rush { top: 0; animation: rushUp 1.5s linear infinite; }
#stage .fall .faller { position: absolute; left: 50%; top: 34%; width: 110px; height: 250px; margin-left: -55px; background: url(assets/img/village/c-you.webp) 0 0 / 500% 400% no-repeat; image-rendering: pixelated; filter: drop-shadow(0 4px 0 rgba(43,35,64,.35)); animation: fallIn .7s cubic-bezier(.2, 1.4, .4, 1), tumble .55s ease-in-out infinite alternate; }
@keyframes rushUp { from { translate: 0 110vh; } to { translate: 0 -45vh; } }
@keyframes fallIn { from { top: -40%; } }
@keyframes tumble { from { rotate: -9deg; translate: -8px 0; } to { rotate: 9deg; translate: 8px 6px; } }
.whiteout { position: fixed; inset: 0; z-index: 9000; background: #fff; opacity: 0; pointer-events: none; transition: opacity .45s ease; }
.whiteout.on { opacity: 1; }
/* Croissant crumbs on Uptima after the crunch (U.crumbs): flakes stuck round her mouth and, while 'falling', two showers dropping off her chin. The bust's ::before is Uptima's halo. */
#stage[data-crumbs] .actor[data-who^="uptima"] .bust::after,
#stage[data-crumbs="falling"] .actor[data-who^="uptima"]::before,
#stage[data-crumbs="falling"] .actor[data-who^="uptima"]::after { content: ''; position: absolute; left: calc(48% - 36px); top: calc(47.5% - 17px); width: 72px; height: 53px; background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 44'><polygon points='16,13 20.5,11.5 22,15.5 18.5,17.5 15.5,16' fill='%23f2c66d' stroke='%239a5a1c' stroke-width='.9' stroke-linejoin='round'/><polygon points='35,15.5 39.5,15 40,18.5 36,19.5' fill='%23e3a94a' stroke='%239a5a1c' stroke-width='.9' stroke-linejoin='round'/><polygon points='25,25 30.5,24.5 31.5,28.5 27,30 24,28' fill='%23f2c66d' stroke='%239a5a1c' stroke-width='.9' stroke-linejoin='round'/><polygon points='34,31 37.5,31.5 36,34.5' fill='%23e3a94a' stroke='%239a5a1c' stroke-width='.9' stroke-linejoin='round'/><polygon points='47,4 51,5 50,8.5 46,7.5' fill='%23f2c66d' stroke='%239a5a1c' stroke-width='.9' stroke-linejoin='round'/></svg>") center / contain no-repeat; pointer-events: none; z-index: 2; }
#stage[data-crumbs="falling"] .actor[data-who^="uptima"]::before,
#stage[data-crumbs="falling"] .actor[data-who^="uptima"]::after { left: calc(48% - 34px); top: calc(47.5% + 8px); width: 67px; height: 48px; background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 56 40'><polygon points='6,4 10,3 11,7 7,8' fill='%23f2c66d' stroke='%239a5a1c' stroke-width='.9' stroke-linejoin='round'/><polygon points='24,1 28,2 27,5 23,4.5' fill='%23e3a94a' stroke='%239a5a1c' stroke-width='.9' stroke-linejoin='round'/><polygon points='42,6 47,5.5 47.5,9.5 43,10' fill='%23f2c66d' stroke='%239a5a1c' stroke-width='.9' stroke-linejoin='round'/><polygon points='15,20 18.5,19 19.5,22.5 16,23.5' fill='%23e3a94a' stroke='%239a5a1c' stroke-width='.9' stroke-linejoin='round'/><polygon points='33,24 36,24.5 34.5,27.5' fill='%23f2c66d' stroke='%239a5a1c' stroke-width='.9' stroke-linejoin='round'/><polygon points='48,30 52,30 51,33.5 47.5,33' fill='%23f2c66d' stroke='%239a5a1c' stroke-width='.9' stroke-linejoin='round'/><polygon points='8,33 11.5,32 12,35.5' fill='%23e3a94a' stroke='%239a5a1c' stroke-width='.9' stroke-linejoin='round'/></svg>"); animation: crumbFall 1.6s ease-in infinite; }
#stage[data-crumbs="falling"] .actor[data-who^="uptima"]::after { transform: scaleX(-1); animation-delay: .8s; opacity: 0; }
@keyframes crumbFall { 0% { translate: 0 0; opacity: 1; } 75% { opacity: 1; } 100% { translate: 4px 150px; opacity: 0; } }
/* Eyelids: they crack open on a blur of light, blink, then open properly as the heavens come into focus. */
#stage .lids { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
#stage .lid { position: absolute; left: -15%; right: -15%; height: 54%; background: #0b0814; transition: transform 1.8s cubic-bezier(.45, 0, .2, 1); }
#stage .lid.top { top: 0; border-radius: 0 0 50% 50% / 0 0 34% 34%; box-shadow: 0 10px 40px 20px #0b0814; }
#stage .lid.bot { bottom: 0; border-radius: 50% 50% 0 0 / 34% 34% 0 0; box-shadow: 0 -10px 40px 20px #0b0814; }
#stage[data-eye="crack"] .lid.top { transform: translateY(-14%); } #stage[data-eye="crack"] .lid.bot { transform: translateY(14%); }
#stage[data-eye="half"] .lid.top { animation: blinkTop 2.4s ease-in-out forwards; } #stage[data-eye="half"] .lid.bot { animation: blinkBot 2.4s ease-in-out forwards; }
#stage[data-eye="open"] .lid.top { transform: translateY(-115%); transition-duration: 2s; } #stage[data-eye="open"] .lid.bot { transform: translateY(115%); transition-duration: 2s; }
#stage[data-eye] > :not(.lids):not(.actor) { transition: filter 2s ease, opacity 2.6s ease; }
#stage[data-eye="closed"] > :not(.lids), #stage[data-eye="crack"] > :not(.lids) { filter: blur(14px) brightness(1.5); }
#stage[data-eye="half"] > :not(.lids) { filter: blur(6px) brightness(1.25); }
@keyframes blinkTop { 0% { transform: translateY(-14%); } 22% { transform: translateY(0); } 100% { transform: translateY(-48%); } }
@keyframes blinkBot { 0% { transform: translateY(14%); } 22% { transform: translateY(0); } 100% { transform: translateY(48%); } }
@keyframes moteUp { from { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } to { transform: translateY(-110vh); opacity: 0; } }
@keyframes featherDown { from { transform: translateY(0) rotate(-30deg); } 25% { transform: translate(30px, 28vh) rotate(25deg); } 50% { transform: translate(-20px, 56vh) rotate(-25deg); } 75% { transform: translate(25px, 84vh) rotate(20deg); } to { transform: translate(0, 116vh) rotate(-30deg); } }
@media (prefers-reduced-motion: reduce) { .foe.foe-atk, .foe.foe-def { animation: none; } #stage .heaven.rays i, #stage .heaven.motes i, #stage .heaven.motes b { animation: none; } }
@keyframes panelIn { from { transform: scale(.94) rotate(-1deg); opacity: 0; } }

/* Toasts */
#notes { position: fixed; top: calc(70px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); z-index: 40; display: grid; gap: 8px; width: min(340px, calc(100% - 24px)); pointer-events: none; }
.sysnote { background: #fff; border: 3px solid var(--ink); border-left-width: 10px; border-left-color: var(--blue); border-radius: 12px; box-shadow: 0 4px 0 var(--ink); padding: 8px 12px; animation: noteIn .35s cubic-bezier(.2, 1.5, .4, 1); transition: opacity .4s, transform .4s; }
.sysnote.gold { border-left-color: var(--sun); background: #fffbe8; }
.sysnote.red { border-left-color: var(--red); background: #fff0f0; }
.sysnote.out { opacity: 0; transform: translateX(20px); }
.sys-h { font-family: var(--f-head); font-weight: 600; font-size: 14px; display: flex; gap: 8px; align-items: center; }
.sys-i { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--blue); color: #fff; font-size: 12px; font-weight: 800; flex: none; }
.sysnote.gold .sys-i { background: var(--sun); color: var(--ink); } .sysnote.red .sys-i { background: var(--red); }
.sys-b { font-size: 13px; margin-top: 2px; }

/* Run screen */
#screen-run { overflow-y: auto; background: linear-gradient(180deg, #d9d0ff, #f3efff 40%, #fff8ec); }
#run { width: 100%; max-width: 980px; margin: 0 auto; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.run-hud { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 0 12px; border-bottom: 3px dashed rgba(43,35,64,.25); }
.run-hud .hud-sla { flex: 1 1 200px; }
.map-wrap { padding-top: 12px; }
.map-title { font-family: var(--f-head); font-weight: 700; font-size: 18px; margin-bottom: 8px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.map-title .muted { font-family: var(--f-body); font-weight: 600; font-size: 13px; }
.map { position: relative; max-width: 640px; margin: 0 auto; border: 3px solid var(--ink); border-radius: 14px; overflow: hidden; background: #2b2340; box-shadow: 0 4px 0 var(--ink); }
.map-bg { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
.map-lines { position: absolute; inset: 0; width: 100%; height: 100%; }
.map-lines path { fill: none; stroke: rgba(255,246,214,.5); stroke-width: 3; stroke-dasharray: 2 7; stroke-linecap: round; }
.map-lines path.on { stroke: var(--sun); stroke-dasharray: none; }
.map-lines path.next { stroke: var(--sun); stroke-width: 4; stroke-dasharray: 6 8; animation: march 0.9s linear infinite; }
@keyframes march { to { stroke-dashoffset: -14; } }
@media (prefers-reduced-motion: reduce) { .map-lines path.next { animation: none; } }
.node .node-art { width: 48px; height: 48px; object-fit: contain; image-rendering: pixelated; filter: drop-shadow(0 2px 0 rgba(0,0,0,.55)); }
.node.can .node-art { filter: drop-shadow(0 0 3px var(--sun)) drop-shadow(0 0 6px var(--sun)); animation: hop 1.1s ease-in-out infinite; }
.node.done .node-art { filter: grayscale(.85) brightness(.75); opacity: .75; }
.map .node:disabled { opacity: 1; }
.node:disabled:not(.done) .node-art { filter: brightness(.8) drop-shadow(0 2px 0 rgba(0,0,0,.55)); }
.node.t-boss .node-art { width: 68px; height: 68px; filter: drop-shadow(0 0 6px var(--red)); }
.node { position: absolute; transform: translate(-50%, -50%); width: 70px; display: grid; justify-items: center; gap: 2px; background: none; border: 0; padding: 0; color: var(--muted); }
.node svg { width: 44px; height: 44px; padding: 8px; fill: currentColor; border-radius: 50%; border: 3px solid rgba(43,35,64,.35); background: #fff; }
.node span { white-space: nowrap; font-family: var(--f-head); font-weight: 600; font-size: 11px; background: rgba(255,255,255,.85); padding: 0 6px; border-radius: 8px; }
.node.can { color: var(--ink); }
.node.can svg { border-color: var(--ink); background: var(--sun); box-shadow: 0 3px 0 var(--ink); animation: hop 1.1s ease-in-out infinite; }
.node.done { color: #a69fbd; }
.node.done svg { background: #ece6f7; }
.node.t-elite.can svg { background: #d8c9ff; }
.node.t-boss svg { width: 58px; height: 58px; border-color: var(--ink); color: #fff; background: var(--red); }
.node.t-boss { color: var(--red); }
.run-foot { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 18px; }

/* Combat */
.combat { display: grid; gap: 10px; padding-top: 6px; }
.foe-zone { display: flex; gap: 14px; align-items: center; padding: 12px; border: 3px solid var(--ink); border-radius: 16px; background: linear-gradient(90deg, #ffe3ec, #fff); box-shadow: 0 4px 0 var(--ink); }
.foe-zone:has(.stage) { display: grid; gap: 10px; padding: 0 0 12px; overflow: hidden; background: #fff; }
.foe-zone:has(.stage) .foe-info { padding: 0 12px; }
.stage { position: relative; aspect-ratio: 400 / 176; max-height: 280px; width: 100%; background-size: cover; background-position: center bottom; image-rendering: pixelated; border-bottom: 3px solid var(--ink); }
.stage .hero { position: absolute; left: 16%; bottom: 6%; width: var(--hw); height: var(--hh); background-image: url(assets/img/battle/hero.webp); background-repeat: no-repeat; image-rendering: pixelated; transform: scale(2.6); transform-origin: bottom center; filter: drop-shadow(0 1px 0 rgba(0,0,0,.6)); }
.stage .hero::after { content: ''; position: absolute; left: 15%; right: 15%; bottom: -2px; height: 4px; border-radius: 50%; background: rgba(0,0,0,.35); z-index: -1; }
.stage .foe { position: absolute; right: 12%; bottom: 3%; width: 150px; height: 150px; }
.bossfight .stage .foe { width: 190px; height: 190px; right: 8%; }
.stage .foe svg image { image-rendering: pixelated; }
.hitflash svg { animation: hitflash .28s steps(2); }
@keyframes hitflash { 0% { filter: brightness(4) saturate(0); } 100% { filter: none; } }
.hero.hurtflash { animation: hurtflash .35s steps(3); }
@keyframes hurtflash { 0%, 66% { filter: brightness(2) sepia(1) hue-rotate(-40deg) saturate(6); } 100% { filter: drop-shadow(0 1px 0 rgba(0,0,0,.6)); } }
.bossfight .foe-zone { background: linear-gradient(90deg, #fff0b8, #fff); }
.foe { flex: none; width: 120px; height: 120px; }
.foe svg { width: 100%; height: 100%; overflow: visible; }
.foe-info { flex: 1; min-width: 0; display: grid; gap: 6px; }
.foe-name { font-family: var(--f-head); font-weight: 700; font-size: 20px; }
.foe-flavor { font-size: 13px; font-style: italic; color: var(--muted); margin-top: -4px; }
.tier { font-family: var(--f-body); font-size: 10px; font-weight: 800; letter-spacing: .08em; padding: 2px 7px; border: 2px solid var(--ink); border-radius: 10px; background: #fff; vertical-align: middle; }
.tier.elite { background: #d8c9ff; } .tier.boss { background: var(--sun); }
.intent { font-size: 14px; font-weight: 700; padding: 6px 10px; border: 2px solid var(--ink); border-radius: 12px; background: #fff; }
.intent .lbl { font-family: var(--f-head); font-weight: 600; font-size: 11px; color: #fff; background: var(--red); padding: 1px 8px; border-radius: 8px; margin-right: 6px; }
.tags { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; }
.clog { min-height: 2.6em; padding: 8px 12px; font-size: 14px; font-weight: 600; border: 2px solid var(--ink); border-radius: 12px; background: #fff; }

/* ---------- This game's look: an overcast, grieving Cloud ----------
   Weathered parchment panels on a storm-dark world, steel and tarnished gold for accents, a carved serif for headings,
   and layers of storm cloud that drift at different speeds (.pcl far, mid and near) behind the title and the cutscenes.
   It overrides the first game's bright storybook colours above. */
:root {
  color-scheme: dark;
  --sky1: #12111a; --sky2: #3a3746; --bg: #15141b;
  --cream: #d6cdb9; --paper: #c7bca4; --bone: #e2dbcb;

  --blue: #3f5f80; --blue-d: #2a4360; --sun: #b8923a; --pink: #8e3b4e; --mint: #4f7f5c; --red: #9e3a34; --violet: #5d4d85; --orange: #a8652d;
  --f-head: "Cinzel", Georgia, "Times New Roman", serif;
}
body { background: var(--bg); }
.ghost, .row button, .bar, .win-h .x, .opt, .conf-b button, .num input, .chip, .hud-chip, .pill, .quest, .plan, .intent, .clog, .me-zone, .card, .foe-card, .c1-lead, .sysnote, .node svg { background: var(--bone); }
.ghost:hover:not(:disabled), .opt:hover:not(:disabled) { background: #ece6d8; }
.opt.on, button.on[aria-pressed="true"] { background: #c9d3dc; }
.primary:hover:not(:disabled) { background: #4d6f93; }
.danger { background: #e2c9c4; color: #7a1f1f; }
.win { box-shadow: 0 6px 0 var(--ink), 0 18px 40px rgba(0, 0, 0, .55); }
.win-h { background: linear-gradient(180deg, #44617f, #2e4660); letter-spacing: .04em; }
#panel { background: rgba(8, 7, 12, .66); }
#hud, .nr-hud { background: #1f1c27; border-bottom-color: #0c0a10; color: var(--bone); }

.c1-lead:hover, .c1-lead:focus-visible { background: #e8dcb8; }
.c1-txt i { color: #6b3a52; }
.sysnote.gold { background: #e9dfc2; } .sysnote.red { background: #e6cfca; }
.card.infra { background: repeating-linear-gradient(135deg, var(--bone) 0 10px, hsl(var(--h) 25% 82%) 10px 20px); }
.clog.coach { background: #d3dcd8; border-color: #3f6f73; }
.foe-zone { background: linear-gradient(90deg, #d8c4c4, var(--bone)); }

.foe-card.tgt { background: #e9dfc2; } .foe-card.down { background: #cfc8b9; }
.energy { background: radial-gradient(circle at 35% 30%, #8fa9c4, var(--blue)); }
.bar.xp i { background: linear-gradient(90deg, var(--blue), #7d9bb8); }
.bar.sla i { background: linear-gradient(90deg, var(--mint), #86b08e); }
.node span { background: rgba(226, 219, 203, .9); }
.node.done svg { background: #b9b2a6; }
#screen-run { background: linear-gradient(180deg, #121118, #24212c 45%, #2e2a33); color: var(--bone); }
#screen-run :is(.foe-zone, .me-zone, .clog, .intent, .card, .foe-card, .opt, .chip, .pill, .hud-chip, .ghost, .win, .bar) { color: var(--ink); }

.c-kind { color: hsl(var(--h) 35% 30%); }

#screen-run .map-title { color: var(--bone); }
.map { background: #16141c; }
/* The battle backdrop, drained and darkened under the fighters. */
.stage::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(40, 42, 66, .7), rgba(22, 20, 32, .55)); mix-blend-mode: multiply; pointer-events: none; }
.stage > * { z-index: 1; }
/* Dialogue. */
.dlg-box { box-shadow: 0 5px 0 var(--ink), 0 14px 30px rgba(0, 0, 0, .5); }
.dlg-nm { background: #2e2a3a; letter-spacing: .06em; font-family: var(--f-head); }
#dialog[data-who="freya"] .dlg-nm { background: #2f6a43; }
#dialog[data-who="kyu"] .dlg-nm { background: #4a3c78; }
#dialog[data-who="uptima"] .dlg-nm { background: #7a3a4a; }
#dialog[data-who="narr"] { background: rgba(8, 7, 12, .84); }
#dialog[data-who="narr"] #dlg-text { color: #e2dbcb; font-weight: 600; text-shadow: 0 2px 8px rgba(0, 0, 0, .6); }
#dialog[data-who="narr"] .dlg-foot { color: #8f8799; }
/* Storm cloud layers: each a seamless strip of cloud that scrolls left at its own speed; the nearer, the faster,
   darker and bigger. --px (-1 to 1, from the pointer) leans them apart for depth. */
.pcl { position: absolute; left: -60px; right: -60px; pointer-events: none; background-repeat: repeat-x; animation: pcl linear infinite; translate: calc(var(--px, 0) * var(--d)) 0; transition: translate .6s ease-out; }
@keyframes pcl { to { background-position-x: calc(var(--w) * -1); } }
.pcl.far { top: 4%; height: 40%; --w: 1200px; --d: 6px; opacity: .8; animation-duration: 160s; background-size: 1200px 100%;
  background-image: radial-gradient(ellipse 200px 46px at 150px 62%, rgba(104, 106, 132, .55), transparent 70%), radial-gradient(ellipse 260px 60px at 560px 42%, rgba(96, 98, 124, .5), transparent 70%), radial-gradient(ellipse 210px 50px at 960px 70%, rgba(110, 110, 136, .5), transparent 70%); }
.pcl.mid { top: 18%; height: 48%; --w: 1500px; --d: 16px; animation-duration: 90s; background-size: 1500px 100%;
  background-image: radial-gradient(ellipse 300px 80px at 240px 55%, rgba(58, 58, 80, .8), transparent 70%), radial-gradient(ellipse 360px 90px at 820px 40%, rgba(52, 52, 74, .78), transparent 70%), radial-gradient(ellipse 280px 70px at 1300px 62%, rgba(62, 60, 84, .75), transparent 70%); }
.pcl.near { bottom: -6%; height: 42%; --w: 1900px; --d: 34px; animation-duration: 48s; background-size: 1900px 100%;
  background-image: radial-gradient(ellipse 420px 110px at 300px 70%, rgba(20, 19, 28, .92), transparent 70%), radial-gradient(ellipse 520px 130px at 1100px 80%, rgba(16, 15, 24, .94), transparent 70%), radial-gradient(ellipse 380px 100px at 1650px 66%, rgba(22, 20, 30, .9), transparent 70%); }
@media (prefers-reduced-motion: reduce) { .pcl { animation: none; } }
/* The title: a storm at night, Freya's halo over it, and the four of them on the ridge. */
#screen-title { background: linear-gradient(180deg, #0c0b12, #1d1b27 45%, #34303f 78%, #2a2632); color: var(--bone); }
#screen-title .cloud { background: #2c2b3a; opacity: .55; filter: blur(2px); }
#screen-title .cloud::before, #screen-title .cloud::after { background: #2c2b3a; }
.t-halo { position: absolute; left: 50%; top: 9%; width: min(46vw, 260px); aspect-ratio: 4 / 1; translate: -50% 0; border-radius: 50%; border: 3px solid rgba(214, 178, 84, .85); box-shadow: 0 0 18px rgba(214, 178, 84, .45), inset 0 0 12px rgba(214, 178, 84, .35); animation: haloGlow 6s ease-in-out infinite; pointer-events: none; }
.t-halo i { position: absolute; right: 6%; top: 58%; width: 12px; height: 9px; border-radius: 50% 60% 40% 50%; background: #d6b254; box-shadow: 0 0 8px rgba(214, 178, 84, .8); }
.t-halo i::after { content: ""; position: absolute; right: 2px; top: 2px; width: 3px; height: 3px; border-radius: 50%; background: #3bd16f; box-shadow: 0 0 6px #3bd16f; }
@keyframes haloGlow { 50% { opacity: .62; box-shadow: 0 0 34px rgba(214, 178, 84, .6), inset 0 0 18px rgba(214, 178, 84, .45); } }
.t-ridge { position: absolute; left: 0; right: 0; bottom: 0; height: 30%; pointer-events: none; background: #0d0c12; clip-path: polygon(0 38%, 9% 30%, 18% 36%, 30% 22%, 41% 30%, 50% 18%, 61% 28%, 72% 20%, 84% 33%, 93% 26%, 100% 32%, 100% 100%, 0 100%); }
.t-leads { position: absolute; left: 50%; bottom: calc(30% * .62 - 6px); translate: -50% 0; pointer-events: none; display: flex; gap: clamp(4px, 2vw, 18px); align-items: flex-end; }
.t-leads img { height: clamp(70px, 15vh, 130px); image-rendering: pixelated; filter: brightness(.08) saturate(0) drop-shadow(0 -1px 0 rgba(214, 205, 185, .35)); }
.t-rain { position: absolute; inset: -20% 0 0; pointer-events: none; opacity: .22; background: repeating-linear-gradient(105deg, transparent 0 14px, rgba(190, 196, 220, .5) 14px 15px, transparent 15px 34px); background-size: 100% 220px; animation: tRain .5s linear infinite; }
@keyframes tRain { to { background-position: -60px 220px; } }
.t-bolt { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 40% 10%, rgba(226, 232, 255, .55), rgba(200, 210, 255, .12) 60%, transparent); opacity: 0; }
.t-bolt.on { animation: tBolt .9s ease-out; }
@keyframes tBolt { 0% { opacity: .9; } 8% { opacity: .1; } 16% { opacity: .75; } 100% { opacity: 0; } }
.logo { color: var(--bone); font-family: var(--f-head); font-weight: 800; letter-spacing: .08em; font-size: clamp(45px, 12.75vw, 106px); line-height: .9; margin: 14px 0 0; animation: none;
  text-shadow: 0 2px 0 #000, 0 0 24px rgba(0, 0, 0, .8), 0 0 2px #000; }
.logo span { color: #e0b453; font-size: .41em; letter-spacing: .22em; margin: .25em 0 0 .22em;
  text-shadow: 0 0 2px #000, 0 0 10px rgba(224, 180, 83, .55), 0 0 26px rgba(224, 180, 83, .3); }
.t-ribbon { background: #4a1f29; color: #ffd6dc; border-color: #0c0a10; box-shadow: 0 3px 0 #0c0a10; font-family: var(--f-head); font-weight: 700; letter-spacing: .2em;
  font-size: clamp(13px, 3.8vw, 19px); padding: 6px 20px; line-height: 1.35; text-shadow: 0 0 6px rgba(255, 92, 120, .85), 0 0 16px rgba(255, 70, 100, .5); }
/* A neon sign losing power: the UN of UNANSWERED sputters and dies, and the sign reads ANSWERED PRAYERS. */
.t-un { animation: tUn 7s linear infinite; }
@keyframes tUn {
  0%, 22% { opacity: 1; } 23% { opacity: .15; } 24% { opacity: 1; } 31% { opacity: 1; } 32% { opacity: .1; } 33% { opacity: .9; } 34%, 36% { opacity: .12; } 37% { opacity: .8; }
  38%, 70% { opacity: .1; text-shadow: none; color: #6a3a44; } 71% { opacity: .7; } 72%, 99% { opacity: .1; text-shadow: none; color: #6a3a44; } 100% { opacity: 1; } }
/* And one letter of the sign above it, on its own failing circuit. */
.t-flk { font-style: normal; animation: tFlk 11s linear infinite; }
@keyframes tFlk { 0%, 61% { opacity: 1; } 62% { opacity: .25; } 63% { opacity: 1; } 64% { opacity: .3; } 66% { opacity: .3; } 67%, 100% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .t-un, .t-flk { animation: none; } .t-un { opacity: .3; text-shadow: none; } }
/* The stack sits a little above centre, clear of the four on the ridge, as the first game's does above its hills. */
#screen-title { padding-bottom: 14vh; }
#screen-title #title-actions { margin-top: 30px; }
.tagline { color: #cfc6b4; font-weight: 600; text-shadow: 0 1px 6px rgba(0, 0, 0, .8); }
.press { background: #2e2a3a !important; color: var(--bone) !important; letter-spacing: .12em; font-family: var(--f-head); }
.t-foot { color: #8f8799; }
#screen-title .snd { background: #2e2a3a; color: var(--bone); }
/* The cutscene stages: the prologue's dream, Uptima's sanctum and the edge of the Cloud, each under moving storm cloud. */
#stage .pcl.far { top: 2%; } #stage .pcl.mid { top: 10%; } #stage .pcl.near { bottom: 18%; height: 36%; }
#stage[data-scene="dream"] { background: radial-gradient(ellipse at 50% 30%, #23223a, #09080f 75%); }
#stage[data-scene="sanctum"] { background: radial-gradient(ellipse at 50% 24%, #6e6a5a, #3a3426 42%, #15120c 90%); }
#stage[data-scene="sanctum"]::before { background: repeating-linear-gradient(90deg, rgba(214, 205, 185, .08) 0 26px, rgba(0, 0, 0, .18) 26px 30px, transparent 30px 90px); }
#stage[data-scene="edge"] { background: linear-gradient(180deg, #2a2a36, #4b4b5a 55%, #262531); }
#stage[data-scene="edge"]::before { background: rgba(226, 219, 203, .2); }

/* ---- Visual-novel cutscenes (js/vn.js) ---- */
#vn { position: fixed; inset: 0; z-index: 40; overflow: hidden; background: #000; color: #e9e6f2; user-select: none; -webkit-user-select: none; }
#vn .vn-cam, #vn .vn-layer, #vn .vn-pic, #vn .vn-rain, #vn .vn-flash, #vn .vn-black { position: absolute; inset: 0; }
#vn .vn-pic { opacity: 0; transition: opacity .9s ease; }
#vn .vn-pic.on { opacity: 1; }
#vn .vn-pic > img, #vn .vn-ph { width: 100%; height: 100%; object-fit: cover; display: block; }
#vn .vn-ph { display: flex; align-items: flex-start; justify-content: flex-end; }
#vn .vn-ph span { margin: 14px 16px; font: 600 11px/1.4 ui-monospace, monospace; color: rgba(255,255,255,.4); text-align: right; letter-spacing: .04em; }
#vn .vn-bg .vn-pic::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,0,0,.55)); }
/* Ken Burns: the camera drifts slowly across a still. */
#vn .kb > * { animation: kbIn 16s ease-out forwards; animation-delay: var(--kbd, 0ms); transform-origin: 50% 45%; }
#vn .kb-left > * { animation-name: kbLeft; }
#vn .kb-right > * { animation-name: kbRight; }
#vn .kb-up > * { animation-name: kbUp; }
@keyframes kbIn { from { transform: scale(1.02); } to { transform: scale(1.16); } }
#vn .kb-slow > * { animation: kbSlow 30s linear forwards; animation-delay: var(--kbd, 0ms); }
@keyframes kbSlow { from { transform: scale(1); } to { transform: scale(1.06); } }
#vn .kb-still > * { animation: none; }
#vn .vn-pic.cut { transition: none; }
#vn .vn-heal { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; }
#vn .vn-heal i { position: absolute; left: var(--hx); top: var(--hy); width: var(--hr); aspect-ratio: 1; translate: -50% -50%; border-radius: 50%; background: radial-gradient(circle, rgba(200,255,190,.95), rgba(80,230,120,.6) 28%, rgba(40,200,90,.18) 55%, rgba(40,200,90,0) 70%); opacity: calc(.65 + var(--heal, 0) * .35); scale: calc(.8 + var(--heal, 0) * .85); transition: opacity .4s, scale .4s; animation: vnHeal 1.6s ease-in-out infinite; }
#vn .vn-heal.held i { animation-duration: .6s; }
#vn .vn-heal.out i { opacity: 0; scale: .5; transition: opacity 1.6s ease-in, scale 1.6s ease-in; animation: vnHealOut .5s steps(2) infinite; }
@keyframes vnHeal { 0%, 100% { transform: scale(.85); filter: brightness(.8); } 50% { transform: scale(1.12); filter: brightness(1.35); } }
@keyframes vnHealOut { 50% { filter: brightness(.4); } }
@media (prefers-reduced-motion: reduce) { #vn .vn-heal i { animation: none; } }
/* A dream: the edges soften and glow, as if seen through sleep. */
#vn .vn-pic.dream > img { filter: saturate(.8) brightness(1.05) contrast(.94); }
#vn .vn-pic.dream::after { content: ""; position: absolute; inset: 0; pointer-events: none; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); background: radial-gradient(ellipse at 50% 48%, rgba(200,210,255,0) 46%, rgba(190,200,240,.18) 78%, rgba(220,226,255,.32)); -webkit-mask: radial-gradient(ellipse at 50% 48%, transparent 46%, #000 80%); mask: radial-gradient(ellipse at 50% 48%, transparent 46%, #000 80%); }
#vn .vn-cg .vn-pic.glitch > * { animation: vnGlitch .65s steps(1) forwards; }
@keyframes kbLeft { from { transform: scale(1.14) translateX(4%); } to { transform: scale(1.14) translateX(-4%); } }
@keyframes kbRight { from { transform: scale(1.14) translateX(-4%); } to { transform: scale(1.14) translateX(4%); } }
@keyframes kbUp { from { transform: scale(1.14) translateY(5%); } to { transform: scale(1.14) translateY(-4%); } }
#vn.flicker .vn-cg .vn-pic > * { animation: kbIn 16s ease-out forwards, vnFlick calc(.9s - var(--flick, 0) * .7s) steps(2) infinite; }
@keyframes vnFlick { 50% { filter: brightness(calc(1 + var(--flick, 0) * 1.2)) saturate(.6); } }
#vn .vn-rain { width: 100%; height: 100%; opacity: 0; transition: opacity 1s; pointer-events: none; }
#vn .vn-rain.on { opacity: 1; }
#vn .vn-flash { background: #eef3ff; opacity: 0; pointer-events: none; }
#vn .vn-flash.go { animation: vnFlash .7s ease-out; }
@keyframes vnFlash { 0% { opacity: .85; } 12% { opacity: .1; } 20% { opacity: .6; } 100% { opacity: 0; } }
#vn .vn-black { background: #000; opacity: 0; transition: opacity .9s; pointer-events: none; z-index: 5; }
#vn .vn-black.on { opacity: 1; }
#vn.shake .vn-cam, #vn.shake .vn-cast { animation: vnShake .45s cubic-bezier(.36,.07,.19,.97); }
@keyframes vnShake { 10%, 90% { transform: translate(-2px, 1px); } 20%, 80% { transform: translate(4px, -2px); } 30%, 50%, 70% { transform: translate(-7px, 2px); } 40%, 60% { transform: translate(7px, -1px); } }
#vn.beat .vn-cam { animation: vnBeat .5s ease-out; }
@keyframes vnBeat { 30% { transform: scale(1.025); filter: brightness(.8); } }
/* Sprites stand on the bottom edge, behind the text box. */
#vn .vn-cast { position: absolute; inset: 0; pointer-events: none; }
#vn.vn-incg .vn-cast { opacity: 0; transition: opacity .6s; }
#vn .vn-spr { position: absolute; bottom: 0; left: 50%; height: min(88vh, 150vw); transform: translateX(-50%) translateY(16px); opacity: 0; transition: left .6s ease, opacity .6s ease, transform .6s ease, filter .4s; display: flex; align-items: flex-end; justify-content: center; }
#vn .vn-spr.on { opacity: 1; transform: translateX(-50%); }
#vn .vn-spr[data-pos="left"] { left: 28%; }
#vn .vn-spr[data-pos="right"] { left: 72%; }
#vn .vn-spr.dim { filter: brightness(.55) saturate(.7); }
#vn .vn-spr > img { height: 100%; width: auto; max-width: none; filter: drop-shadow(0 0 24px rgba(0,0,0,.6)); }
#vn .vn-spr > img.px { image-rendering: pixelated; height: 72%; margin-bottom: 18vh; }
#vn .vn-spr.bump > * { animation: vnBump .35s ease-out; }
@keyframes vnBump { 40% { transform: translateY(-6px); } }
#vn .vn-sil { width: min(46vh, 70vw); height: 70%; margin-bottom: 14vh; border-radius: 45% 45% 12% 12% / 30% 30% 8% 8%; background: radial-gradient(ellipse at 50% 20%, var(--t), rgba(0,0,0,.9) 80%); display: flex; align-items: center; justify-content: center; }
#vn .vn-sil span { font: 700 14px Cinzel, serif; color: rgba(255,255,255,.45); letter-spacing: .1em; }
#vn .vn-spr.glitch > * { animation: vnGlitch 1.3s steps(1) forwards; }
@keyframes vnGlitch {
  0% { clip-path: inset(0); filter: none; transform: none; }
  8% { clip-path: inset(12% 0 64% 0); transform: translateX(-14px); filter: hue-rotate(90deg) saturate(3); }
  16% { clip-path: inset(40% 0 30% 0); transform: translateX(18px); filter: drop-shadow(6px 0 #ff2a6d) drop-shadow(-6px 0 #05d9e8); }
  24% { clip-path: inset(0); transform: skewX(8deg); filter: invert(.85) hue-rotate(120deg); }
  32% { clip-path: inset(70% 0 4% 0); transform: translateX(-24px); filter: drop-shadow(8px 0 #36d86b); }
  40% { clip-path: inset(0); transform: none; filter: brightness(2.4) saturate(0); }
  50% { clip-path: inset(22% 0 50% 0); transform: translateX(26px) scaleY(1.04); filter: drop-shadow(-8px 0 #36d86b) hue-rotate(-60deg); }
  60% { clip-path: inset(0); transform: skewX(-10deg); filter: drop-shadow(6px 0 #ff2a6d) drop-shadow(-6px 0 #05d9e8); }
  72% { clip-path: inset(55% 0 20% 0); transform: translateX(-10px); filter: none; }
  84% { clip-path: inset(0); transform: translateX(4px); filter: drop-shadow(3px 0 #36d86b); }
  100% { clip-path: inset(0); transform: none; filter: none; }
}
/* The text box: wide, dark glass, a name plate on its top edge. */
#vn .vn-box { position: absolute; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(960px, calc(100% - 24px)); min-height: 128px; box-sizing: border-box; padding: 26px 22px 30px; background: linear-gradient(180deg, rgba(14,13,24,.78), rgba(8,7,14,.92)); border: 1px solid rgba(255,255,255,.14); border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.6); cursor: pointer; z-index: 3; }
#vn .vn-name { position: absolute; left: 18px; top: -15px; padding: 5px 16px; font: 700 14px Cinzel, serif; letter-spacing: .08em; color: #fff; background: #3a2f5c; border: 1px solid rgba(255,255,255,.25); border-radius: 6px; }
#vn .vn-box[data-who="freya"] .vn-name { background: #1f5a37; }
#vn .vn-box[data-who="mira"] .vn-name { background: #5a5f70; }
#vn .vn-box[data-who="kai"] .vn-name { background: #6a4a22; }
#vn .vn-box[data-who="seoyeon"] .vn-name { background: #6a1f2a; }
#vn .vn-box[data-who="dutch"] .vn-name { background: #2a3f66; }
#vn .vn-text { font: 400 clamp(15px, 2.1vw, 19px)/1.55 Nunito, sans-serif; min-height: 3em; text-shadow: 0 1px 2px #000; }
#vn .vn-box[data-who="narr"] .vn-text { font-style: italic; color: #c9c3dc; }
#vn .vn-foot { position: absolute; right: 12px; bottom: 6px; display: flex; gap: 12px; align-items: center; }
#vn .vn-more { opacity: 0; font-size: 12px; color: #c9c3dc; }
#vn.vn-ready .vn-more { opacity: 1; animation: bob 1.2s ease-in-out infinite; }
#vn .vn-skip { background: none; border: 0; color: rgba(255,255,255,.45); font: 600 12px Nunito, sans-serif; cursor: pointer; padding: 4px; }
/* The moments you play. */
#vn .vn-act { position: absolute; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; z-index: 4; }
#vn .vn-panel { width: min(520px, calc(100% - 24px)); box-sizing: border-box; padding: 18px; background: rgba(8,7,14,.88); border: 1px solid rgba(255,255,255,.16); border-radius: 10px; text-align: center; animation: vnRise .35s ease-out; }
@keyframes vnRise { from { opacity: 0; transform: translateY(20px); } }
#vn .vn-meter { display: grid; grid-template-columns: 70px 1fr auto; gap: 10px; align-items: center; margin-bottom: 10px; text-align: left; font: 600 13px Nunito, sans-serif; }
#vn .bar { height: 12px; background: #1d1b2a; border: 1px solid rgba(255,255,255,.2); border-radius: 6px; overflow: hidden; }
#vn .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #7fe0a0, #d6ffe3); transition: width .1s linear; }
#vn .bar.hp i { background: #c0303a; }
#vn .bar.crack i { background: linear-gradient(90deg, #ffd36b, #fff6d0); }
#vn .bar.fail i { transition: width 1.6s ease-in; background: #8a2f3a; }
#vn .bar.timer { margin: 10px 0 14px; }
#vn .bar.timer i { width: 100%; background: #e04050; }
#vn .bar.timer i.run { transition: width 1s linear; width: 0; }
#vn .vn-hold { margin-top: 6px; padding: 12px 28px; font: 700 16px Nunito, sans-serif; color: #fff; background: #3a2f5c; border: 1px solid rgba(255,255,255,.3); border-radius: 8px; cursor: pointer; touch-action: none; }
#vn .vn-hold:active { background: #52437f; }
#vn .vn-hold.letgo { background: #20202a; color: #c9c3dc; }
#vn .vn-hold[disabled] { opacity: .4; }
#vn .vn-note { min-height: 1.4em; margin: 10px 0 0; font: italic 400 15px Nunito, sans-serif; color: #e7c3c8; }
#vn .vn-q { margin: 0 0 6px; font: 600 15px Nunito, sans-serif; }
#vn .vn-opts { display: flex; gap: 10px; justify-content: center; }
#vn .vn-opts button { padding: 10px 22px; font: 700 15px Nunito, sans-serif; color: #fff; background: #4a1f2a; border: 1px solid rgba(255,255,255,.3); border-radius: 8px; }
#vn .vn-opts button.freeze { animation: vnShake .3s; }
#vn .out .vn-opts button { opacity: .3; }
#vn .vn-stamp { display: inline-block; padding: 4px 12px; font: 800 18px ui-monospace, monospace; color: #ff5a6a; border: 2px solid #ff5a6a; transform: rotate(-4deg); font-style: normal; }
#vn .vn-knocks { display: flex; gap: 18px; justify-content: center; margin: 8px 0 12px; }
#vn .vn-knocks .grp { display: flex; gap: 6px; }
#vn .vn-knocks i { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(255,255,255,.4); }
#vn .vn-knocks i.on { background: #d9cfff; box-shadow: 0 0 8px #b9a3ff; }
#vn .vn-req { text-align: left; font: 13px/1.5 ui-monospace, monospace; }
#vn .vn-req-h b { color: #7fd0ff; margin-right: 6px; }
#vn .vn-req-b { margin: 10px 0; font: italic 400 16px/1.5 Nunito, sans-serif; color: #fff; }
#vn .vn-req-s { display: flex; gap: 10px; align-items: center; color: #b7b0cc; }
#vn .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,.2); border-top-color: #fff; animation: spin .8s linear infinite; }
#vn .err { color: #ff5a6a; font-weight: 700; }
#vn .dead { border-color: rgba(255,90,106,.5); }
@media (prefers-reduced-motion: reduce) { #vn .kb > *, #vn .vn-spr.glitch > * { animation: none; } }
/* Phones: smaller sprites. */
@media (max-aspect-ratio: 4/5) { #vn .vn-spr { height: 66vh; } }
/* Phones, and any screen taller than it is wide: two waist-up sprites side by side would overlap, so only one shows,
   centred: the speaker's (js/vn.js marks it .lead). A new speaker swaps in with a quick crossfade, at once with
   reduced motion. Wider screens keep both up, the listener dimmed. */
@media (max-width: 600px), (orientation: portrait) {
  #vn .vn-spr, #vn .vn-spr[data-pos] { left: 50%; transition: opacity .2s ease, transform .2s ease, filter .2s; }
  #vn .vn-spr.on:not(.lead) { opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { #vn .vn-spr, #vn .vn-spr[data-pos] { transition: none; } }
</style>
</head>
