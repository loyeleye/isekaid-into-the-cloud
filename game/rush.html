<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Rush (prototype)</title>
<!-- Test page for the Sorting Floor as a real-time game (js/rush-core.js rules, js/rush.js drawing). Not linked from
     the game yet. Serve game/ (python3 -m http.server 8000) and open http://localhost:8000/rush.html.
     ?seed=N picks the night's ticket order; ?tall forces the phone layout. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
:root { --ink: #2b2340; --paper: #fbf3e2; --line: #c9b48a; --gold: #f5c45a; --mint: #2fbf7f; --red: #e2574c;
  --f-head: "Fredoka", "Trebuchet MS", system-ui, sans-serif; --f-body: "Nunito", "Segoe UI", system-ui, sans-serif; }
html, body { margin: 0; height: 100%; background: #120e16; overflow: hidden; overscroll-behavior: none; }
body { font: 16px/1.45 var(--f-body); color: var(--ink); -webkit-tap-highlight-color: transparent; }
#rush { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
#q { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 16px;
  background: rgba(14, 10, 18, .72); box-sizing: border-box; overflow-y: auto; }
#q.on { display: flex; }
.q-card { width: 100%; max-width: 640px; background: var(--paper); border: 4px solid #3a2a1a; border-radius: 18px;
  padding: 18px 18px 16px; box-shadow: 0 18px 50px rgba(0,0,0,.5); box-sizing: border-box; margin: auto; }
.q-card h2 { font: 700 22px var(--f-head); margin: 0 0 4px; }
.q-card .q-sum { margin: 0 0 12px; color: #5b4c3a; font-weight: 700; font-size: 14px; }
.q-card .q-ask { font: 600 13px var(--f-head); letter-spacing: .06em; text-transform: uppercase; color: #8a6a2a; margin: 0 0 4px; }
.q-card .q-text { margin: 0 0 12px; font-weight: 700; }
.q-opts { display: grid; gap: 8px; }
.q-opts button { min-height: 48px; text-align: left; font: 700 15px var(--f-body); color: var(--ink); background: #fff;
  border: 3px solid #3a2a1a; border-radius: 12px; padding: 8px 12px; cursor: pointer; }
.q-opts button:hover:not(:disabled) { background: #fff6d8; }
.q-opts button.right { background: #d9f5e4; border-color: #1f8a55; }
.q-opts button.wrong { background: #fde0dc; border-color: #b23a2f; }
.q-opts button:disabled { cursor: default; }
.q-why { margin: 12px 0 0; padding: 10px 12px; background: #fff; border: 2px dashed var(--line); border-radius: 12px; display: none; }
.q-why.on { display: block; }
.q-again { margin-top: 12px; width: 100%; min-height: 50px; font: 700 18px var(--f-head); color: #2b1a08; background: var(--gold);
  border: 3px solid #3a2a1a; border-radius: 14px; cursor: pointer; display: none; }
.q-again.on { display: block; }
</style>
</head>
<body>
<canvas id="rush" aria-label="The Rush: drag tools from the toolbelt into the room, then pull the lever. Keys: Space pulls the lever, 1 to 3 place the rack, the bolted stools and the bin."></canvas>
<div id="q" role="dialog" aria-modal="true" aria-labelledby="q-h"></div>
<script src="js/rush-core.js"></script>
<script src="js/rush.js"></script>
</body>
</html>
