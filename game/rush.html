<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Rush (prototype)</title>
<!-- Test page for the Sorting Floor as a real-time game (js/rush-core.js rules, js/rush.js drawing). Not linked from
     the game yet. Serve game/ (python3 -m http.server 8000) and open http://localhost:8000/rush.html.
     ?seed=N picks the night's ticket order, ?claim=bell starts on claim 2 (with its Night Orders pick first),
     ?orders=cold,shelf pins those orders and skips the pick, and ?tall forces the phone layout. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
:root { --ink: #2b2340; --paper: #fbf3e2; --line: #c9b48a; --gold: #f5c45a; --mint: #2fbf7f; --red: #e2574c;
  --f-head: "Fredoka", "Trebuchet MS", system-ui, sans-serif; --f-body: "Nunito", "Segoe UI", system-ui, sans-serif; }
html, body { margin: 0; height: 100%; background: #120e16; overflow: hidden; overscroll-behavior: none; }
body { font: 16px/1.45 var(--f-body); color: var(--ink); -webkit-tap-highlight-color: transparent; }
#rush { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
#q { position: fixed; inset: 0; display: none; box-sizing: border-box; }
#q.on { display: flex; }
/* A letter: parchment with a wax seal, over the dimmed room. The room waits while it's open. */
#q.letter { align-items: center; justify-content: center; padding: 16px; background: rgba(14, 10, 18, .6); overflow-y: auto; }
.lt-card { position: relative; width: 100%; max-width: 620px; margin: auto; box-sizing: border-box; padding: 26px 22px 18px;
  background: radial-gradient(120% 90% at 30% 20%, #fbf2db, #efdfb6 70%, #e3cd98); color: #2a1d10;
  border-radius: 6px; box-shadow: 0 0 0 2px #6b4e24, 0 20px 50px rgba(0,0,0,.55); transform: rotate(-.6deg);
  animation: lt-in .35s cubic-bezier(.2,1.4,.4,1); }
@keyframes lt-in { from { transform: translateY(-40px) rotate(-6deg) scale(.9); opacity: 0; } }
.lt-seal { position: absolute; top: -18px; left: 50%; width: 40px; height: 40px; margin-left: -20px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #e6bb55, #b07f1e 60%, #6e4a0c); box-shadow: 0 3px 6px rgba(0,0,0,.4); }
.lt-kind { margin: 0 0 6px; font: 700 14px var(--f-head); letter-spacing: .08em; text-transform: uppercase; color: #8a5f1c; text-align: center; }
.lt-torn-tag { display: inline-block; margin-left: 6px; padding: 0 8px; border-radius: 6px; background: #b23a2f; color: #fff; letter-spacing: .04em; }
.lt-text { margin: 0 0 14px; font-weight: 800; font-size: 17px; }
.lt-opts { display: grid; gap: 8px; }
.lt-opts button { display: flex; gap: 10px; align-items: center; min-height: 48px; text-align: left; font: 700 15px var(--f-body); color: #2a1d10;
  background: rgba(255,255,255,.55); border: 2px solid #6b4e24; border-radius: 10px; padding: 8px 12px; cursor: pointer; }
.lt-opts button:hover:not(:disabled) { background: #fff; }
.lt-opts button kbd { flex: none; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 6px; background: #6b4e24; color: #fbf2db; font: 700 13px var(--f-head); }
.lt-opts button.none { border-style: dashed; }
.lt-opts button.right { background: #d9f5e4; border-color: #1f8a55; }
.lt-opts button.wrong { background: #fde0dc; border-color: #b23a2f; }
.lt-opts button:disabled { cursor: default; }
/* "Which piece fixes it?": the options are the belt's tools, as tiles. */
.fmt-b .lt-opts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.fmt-b .lt-opts button { flex-direction: column; justify-content: center; text-align: center; gap: 2px; min-height: 120px; }
.fmt-b .lt-opts button kbd { align-self: flex-start; }
.fmt-b .lt-opts button > span { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.fmt-b .lt-opts img { height: 52px; width: auto; }
.fmt-b .lt-opts small { font: 600 12px var(--f-body); color: #6b5530; }
.fmt-b .lt-opts button.none { grid-column: 1 / -1; min-height: 48px; }
/* "Find the false one": statements on the letter; the false one gets a red stamp. */
.fmt-c .lt-opts button.right::after { content: 'FALSE'; margin-left: auto; padding: 0 8px; border: 3px solid #b23a2f; color: #b23a2f; font: 700 14px var(--f-head); transform: rotate(-8deg); }
.fmt-c .lt-opts button.none.right::after { content: 'ALL TRUE'; border-color: #1f8a55; color: #1f8a55; }
.lt-rip { margin: 10px -22px 0; padding: 6px 22px; font: 700 13px var(--f-body); color: #7a2a20;
  background: linear-gradient(135deg, transparent 6px, #e3cd98 0) top left / 14px 100% repeat-x; border-top: 2px dashed #9a6a3a; }
.lt-why { margin: 12px 0 0; padding: 10px 12px; background: rgba(255,255,255,.7); border-radius: 10px; display: none; font-size: 15px; }
.lt-why.on { display: block; }
.lt-go { margin-top: 12px; width: 100%; min-height: 50px; font: 700 18px var(--f-head); color: #2b1a08; background: var(--gold);
  border: 3px solid #3a2a1a; border-radius: 14px; cursor: pointer; display: none; }
.lt-go.on { display: block; }
/* The end of a claim: no popup. The stamp stays on the room, with this strip along the bottom. */
#q.end { align-items: flex-end; justify-content: center; pointer-events: none; padding: 0 12px calc(12px + env(safe-area-inset-bottom, 0px)); }
.end-strip { pointer-events: auto; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between;
  width: 100%; max-width: 900px; box-sizing: border-box; padding: 12px 14px; background: rgba(24, 20, 30, .94); color: #f2e6cc;
  border: 3px solid #be9650; border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,.5); animation: end-in .4s ease-out; }
@keyframes end-in { from { transform: translateY(120%); } }
.end-strip b { display: block; font: 700 20px var(--f-head); color: #ffe6a8; }
.end-strip span { font-weight: 700; font-size: 14px; color: #d8c9a8; }
.end-go { min-height: 50px; padding: 0 20px; font: 700 18px var(--f-head); color: #2b1a08; background: var(--gold); border: 3px solid #3a2a1a; border-radius: 14px; cursor: pointer; }
/* Dutch's word on the first letter of the night. */
.lt-dutch { display: flex; gap: 12px; align-items: center; margin: 4px 0 14px; padding: 10px; background: rgba(255,255,255,.6); border: 2px solid #6b4e24; border-radius: 10px; }
.lt-dutch img, .no-dutch img { flex: none; width: 64px; height: 64px; border-radius: 10px; background: #efe2c4; object-fit: cover; }
.lt-dutch p, .no-dutch p { margin: 0; font-weight: 700; font-size: 15px; }
/* Timeout: the clock on a letter. */
.lt-clock { height: 10px; margin: 0 0 12px; border-radius: 6px; background: rgba(107,78,36,.25); overflow: hidden; }
.lt-clock i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #b23a2f, #e0a03a); }
/* High stakes: the bet, before the options. */
.lt-bet { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 12px; font: 700 15px var(--f-body); }
.lt-bet button { width: 44px; height: 44px; border-radius: 50%; border: 3px solid #3a2a1a; background: #f3e3b8; font: 700 18px var(--f-head); color: #2b1a08; cursor: pointer; }
.lt-bet button.on { background: var(--gold); box-shadow: 0 0 0 3px #fff6d6; }
.lt-bet button:disabled { opacity: .45; cursor: default; }
.lt-bet small { font-size: 13px; color: #6b5530; }
/* Night Orders: two notices on a cork board before claims 2 and 3. */
#q.orders { align-items: center; justify-content: center; padding: 16px; background: rgba(14, 10, 18, .66); overflow-y: auto; }
.no-board { width: 100%; max-width: 700px; margin: auto; box-sizing: border-box; padding: 20px 18px; border-radius: 12px;
  background: radial-gradient(140% 100% at 30% 20%, #b07a48, #8a5a32 70%, #6e4526); box-shadow: 0 0 0 4px #3a2414, 0 20px 50px rgba(0,0,0,.55); color: #fff3dc;
  animation: lt-in .35s cubic-bezier(.2,1.4,.4,1); }
.no-kind { margin: 0 0 4px; font: 700 13px var(--f-head); letter-spacing: .08em; text-transform: uppercase; color: #ffd98a; }
.no-board h2 { margin: 0 0 14px; font: 700 24px/1.2 var(--f-head); }
.no-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.no-card { position: relative; display: flex; flex-direction: column; gap: 6px; text-align: left; padding: 36px 14px 14px; min-height: 170px; cursor: pointer;
  background: #f6ead0; color: #2a1d10; border: 0; border-radius: 4px; box-shadow: 0 6px 14px rgba(0,0,0,.4); font: 700 15px var(--f-body); transform: rotate(-1.2deg); }
.no-card:nth-child(2) { transform: rotate(1.4deg); }
.no-card:hover, .no-card:focus-visible { outline: 3px solid var(--gold); }
.no-card::before { content: ''; position: absolute; top: 6px; left: 50%; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: #b23a2f; box-shadow: 0 2px 3px rgba(0,0,0,.5); }
.no-card kbd { position: absolute; top: 8px; left: 10px; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 6px; background: #6b4e24; color: #fbf2db; font: 700 12px var(--f-head); }
.no-card b { font: 700 20px var(--f-head); }
.no-card small { margin-top: auto; font: 700 12px var(--f-body); letter-spacing: .04em; text-transform: uppercase; color: #8a5f1c; }
.no-have { margin: 12px 0 0; font-weight: 700; font-size: 14px; color: #ffe6b8; }
.no-dutch { display: flex; gap: 14px; align-items: flex-start; padding: 14px; background: #fbf3e2; color: #2a1d10; border-radius: 10px; }
.no-rule { margin: 12px 0 0; padding: 10px 12px; border: 2px dashed #ffd98a; border-radius: 10px; font-weight: 800; }
.no-go { margin-top: 14px; width: 100%; min-height: 52px; font: 700 20px var(--f-head); color: #2b1a08; background: var(--gold); border: 3px solid #3a2a1a; border-radius: 14px; cursor: pointer; }
.no-back { margin-top: 10px; width: 100%; min-height: 44px; font: 700 15px var(--f-body); color: #fff3dc; background: transparent; border: 2px solid #ffd98a; border-radius: 12px; cursor: pointer; }
@media (max-width: 520px) { .no-cards { grid-template-columns: 1fr; } .no-card { min-height: 0; } .no-board h2 { font-size: 21px; } .no-dutch img { width: 52px; height: 52px; } }
@media (max-width: 520px) { .fmt-b .lt-opts button { min-height: 104px; } .end-go { width: 100%; } .lt-card { padding: 24px 14px 14px; } .lt-rip { margin: 10px -14px 0; padding: 6px 14px; } }
</style>
</head>
<body>
<canvas id="rush" aria-label="The Rush: drag tools from the toolbelt into the room, then pull the lever. Keys: Space pulls the lever, 1 to 3 place the rack, the bolted stools and the bin."></canvas>
<div id="q" role="dialog" aria-modal="true" aria-labelledby="q-h"></div>
<script src="js/rush-core.js"></script>
<script src="js/rush.js"></script>
</body>
</html>
